# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
#          - os: windows-latest
#            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang


    env:
      BUILD_DIR: build
      CTEST_OUTPUT_ON_FAILURE: "1"
      JOBS: 2
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Set up ccache (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Install Ninja on Linux
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev libboost-system-dev libboost-program-options-dev libssl-dev libspdlog-dev libboost-all-dev

    - name: Install Ninja on macOS
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Install Ninja on Windows
      if: runner.os == 'Windows'
      run: choco install -y ninja 
      
    - name: Show workspace and conanfile
      shell: bash
      run: |
        echo "PWD: $(pwd)"
        echo "Workspace: $GITHUB_WORKSPACE"
        ls -la
        if [ -f conanfile.py ]; then
          echo "Found conanfile.py:"
          sed -n '1,120p' conanfile.py || true
        else
          echo "conanfile.py NOT found in repo root!"
        fi

    - name: Install Conan (all platforms)
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade conan
        conan --version

    - name: Ensure Conan profiles (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "Existing profiles:"
        conan profile list || true
        # Try to create / detect default profile (Conan 2 variants)
        conan profile detect --name default || conan profile detect || true
        conan profile list
        # show default profile (try both forms)
        conan profile show --name default || conan profile show default || true

    - name: Ensure Conan profiles (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        conan --version
        Write-Host "Existing profiles:"
        conan profile list
        try {
          conan profile detect --name default
        } catch {
          try { conan profile detect } catch { Write-Host "profile detect failed, continuing..." }
        }
        try { conan profile show --name default } catch { conan profile show default }

    - name: Conan install (generate CMakeToolchain + CMakeDeps)
      shell: bash
      run: |
        set -e
        BUILD_DIR="${{ steps.strings.outputs.build-output-dir }}"
        echo "Conan install into: $BUILD_DIR"
        pwd
        ls -la
        # Use explicit profiles to avoid ambiguity in CI
        conan install . --output-folder "$BUILD_DIR" --build=missing -s build_type=${{ matrix.build_type }} -g CMakeToolchain -g CMakeDeps --profile:host=default --profile:build=default
        echo "Install exit status: $?"

    - name: Show generated Conan files (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        BUILD_DIR="${{ steps.strings.outputs.build-output-dir }}"
        echo "Listing build dir: $BUILD_DIR"
        ls -la "$BUILD_DIR" || true
        echo "Find conan generated files:"
        find "$BUILD_DIR" -maxdepth 2 -type f -name 'conan*' -print || true
        if [ -f "$BUILD_DIR/conan_toolchain.cmake" ]; then
          echo "---- conan_toolchain.cmake head ----"
          sed -n '1,200p' "$BUILD_DIR/conan_toolchain.cmake" || true
          echo "---- end ----"
        else
          echo "conan_toolchain.cmake not found in $BUILD_DIR"
        fi
        echo "Check ninja:"
        which ninja || true
        ninja --version || true

    - name: Show generated Conan files (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $BUILD_DIR = "${{ steps.strings.outputs.build-output-dir }}"
        Write-Host "Listing build dir: $BUILD_DIR"
        Get-ChildItem -Path $BUILD_DIR -Force -Recurse -ErrorAction SilentlyContinue | Select-Object -First 200
        $toolchain = Join-Path $BUILD_DIR "conan_toolchain.cmake"
        if (Test-Path $toolchain) {
          Write-Host "---- conan_toolchain.cmake ----"
          Get-Content $toolchain -TotalCount 200
        } else {
          Write-Host "conan_toolchain.cmake not found"
        }
        Write-Host "Check ninja:"
        Get-Command ninja -ErrorAction SilentlyContinue
        try { ninja --version } catch { Write-Host "ninja not found or failed" }

    - name: Ensure Ninja on Linux
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # ensure ninja is installed (sudo available on ubuntu images)
        sudo apt-get update
        sudo apt-get install -y ninja-build
        which ninja
        ninja --version

    - name: Configure CMake (Linux/macOS - use Ninja)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        BUILD_DIR="${{ steps.strings.outputs.build-output-dir }}"
        cmake -B "$BUILD_DIR" \
          -G Ninja \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_TOOLCHAIN_FILE="$BUILD_DIR/conan_toolchain.cmake" \
          -S "${{ github.workspace }}"

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $BUILD_DIR = "${{ steps.strings.outputs.build-output-dir }}"
        cmake -B $BUILD_DIR `
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_TOOLCHAIN_FILE="$BUILD_DIR/conan_toolchain.cmake" `
          -S "${{ github.workspace }}"

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}
